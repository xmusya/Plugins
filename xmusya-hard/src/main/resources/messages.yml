# messages.yml — все тексты плагина xmusya-hard (можно переводить).
#
# Подстановки: {0}, {1}, ... (порядок — как в описании рядом с ключом).
# Цвета/форматирование: &0-&9, &a-&f, &l (жирный), &o (курсив), &r (сброс).
# Если ключ удалить — будет использован встроенный русский текст.
# Новые ключи дописываются автоматически при обновлении плагина
# (копия старого файла — messages.yml.bak).
#
# Префикс чата задаётся отдельно: config.yml -> prefix.

# ------------------------------------------------------------------ боссбар
bossbar:
  # {0} — фаза, {1} — текущий день, {2} — последний день прогрессии
  phase: "&7Фаза: &e{0}&7 | День &e{1}&7 из &e{2}"
  # полоса-предупреждение за день до Кровавой луны
  warning: "&c⚠ Завтра Кровавая луна!"

# ------------------------------------------------------------------ дни и барьер
day:
  # {0} — номер дня
  new_day: "&7Наступил день &e{0}&7."

border:
  # {0} — размер барьера в блоках
  expand: "&bБарьер расширяется до {0} блоков."
  grow: "&bБарьер вырос: {0} блоков."
  phase: "&bБарьер расширен до {0} блоков (новая фаза)."

# ------------------------------------------------------------------ Кровавая луна
bloodmoon:
  # префикс сообщений КЛ (можно сделать пустым)
  header: "&4[КРОВАВАЯ ЛУНА] "
  start: "&cНаступила кровавая ночь! Сон и невидимость заблокированы, монстры вышли на охоту!"
  survived: "&6Кровавая луна пережита! +1 к счетчику, +3 уровня опыта, насыщение."
  over: "&6Кровавая луна окончена. Погода ясная."
  sleep_blocked: "Вы не можете уснуть во время Кровавой луны!"
  # actionbar тем, кто прячется за стенами / в шахте
  walls: "Стены не спасут вас от Кровавой луны... Выйдите наружу!"
  depth: "Глубина и высота не скроют вас от ночной охоты!"
  start_manual: "&6Кровавая луна запущена вручную."
  stop_manual: "&6Кровавая луна остановлена вручную."
  pause: "&6Кровавая луна на паузе (эффекты приостановлены)."
  resume: "&aКровавая луна возобновлена."

# ------------------------------------------------------------------ рейды
# Иллюзионер спавнится тихо (как в ванили) — сообщения нет.
# Ключ raid.illusioner оставлен для совместимости, но не используется.

# ------------------------------------------------------------------ время и прогресс
time:
  paused: "&eФазы и счётчик дней поставлены на паузу (время мира остановлено)."
  resumed: "&aФазы и счётчик дней продолжаются."
  skip: "&6День пропущен администратором."
  # {0} — стартовый размер барьера
  reset: "&6Прогресс сброшен (день 0, фаза wood, барьер {0})."
  no_players: "&7На сервере нет живых игроков (30 сек). Мир и таймер дней приостановлены."
  players_back: "&7Живой игрок в сети. Ход времени, погоды и дней возобновлен."

# ------------------------------------------------------------------ торговля
trade:
  # {0} — день, когда торговля откроется
  locked: "Торговля с жителями откроется на {0}-й день!"

# ------------------------------------------------------------------ достижения
achievements:
  # {0} — название достижения
  granted: "&6Достижение: &e{0}"
  # {0} — получено, {1} — всего
  progress: "&6Достижения: &e{0} / {1}"

# ------------------------------------------------------------------ книга-гайд
guide:
  received: "Вам выдана книга-гайд. Откройте её в инвентаре."
  # {0} — сколько секунд осталось
  cooldown: "Книгу-гайд можно получить раз в 2 минуты (осталось {0} сек)."

# ------------------------------------------------------------------ Энд
end:
  portal_open: "&dПортал в Энд открыт!"
  # {0} — сколько рамок сброшено
  portal_off: "&5Портал в Энд погас! Сброшено рамок: {0}. Соберите ресурсы заново."
  # {0} — сколько рамок выбито
  break_normal: "&4Обычный слом: выбито рамок портала — {0}. Их нужно починить вручную!"
  break_ultra: "&4УЛЬТРА-СЛОМ: выбита рамка портала! Починка требует очень редких ресурсов и головы моба."
  # {0} — ник игрока
  egg_keeper: "&dХранитель яйца дракона: {0}. Бесконечные Спешка II и Скорость I."
  egg_keeper_prev: "&7Права хранителя яйца дракона перешли к {0}."
  # {0} — причина, {1} — часов проклятия
  curse: "{0}&4 Проклятие на {1} ч и запрет входа в Энд."

# ------------------------------------------------------------------ Драконий маяк
beacon:
  created: "Драконий маяк создан! ПКМ по яйцу — настройка эффектов."

# ------------------------------------------------------------------ фазы (админ)
phase:
  # {0} — название фазы, {1} — день, {2} — барьер
  set: "&6Фаза установлена администратором: {0} (день {1}, барьер {2})."

# ------------------------------------------------------------------ сообщения команд (админ)
command:
  no_permission: "&cНедостаточно прав."
  unknown: "&cНеизвестная подкоманда. /xmh — меню."
  player_offline: "&cИгрок не в сети."
  reloaded: "&aconfig.yml и messages.yml перечитаны."
