# ============================================================
#  xmusya-hard — конфигурация
#  Читается при старте сервера и по команде /xmh reload.
#
#  Порядок фаз фиксирован (сверху вниз):
#    wood -> stone -> iron -> diamond -> nether ->
#    golden_food -> villagers -> beacons -> netherite -> endgame
#
#  У каждой фазы есть:
#    day                    — день, с которого она начинается
#    border                 — размер барьера при переходе на фазу через /xmh phase
#    name / short-name      — названия в чате и боссбаре
#    limited-crafting       — геймрул limited_crafting в этой фазе
#    natural-regeneration   — геймрул natural_health_regeneration в этой фазе
#    trade                  — разрешена ли торговля с жителями
#    dimensions             — разрешённые измерения: overworld / nether / end
#    forbidden-armor        — броня, которую НЕЛЬЗЯ носить (выбрасывается)
#                             ключи: iron, golden, diamond, netherite, elytra
#                             или точный id предмета: minecraft:turtle_helmet
#    forbidden-tools        — инструменты/оружие, за которые даётся
#                             mining_fatigue + weakness
#                             ключи: stone, iron, golden, diamond, netherite
#                             или точный id: minecraft:trident
#    forbidden-items        — предметы, которые выбрасываются из инвентаря
#    recipes                — рецепты, ОТКРЫВАЮЩИЕСЯ на этой фазе
#                             (дальше они остаются открытыми навсегда)
# ============================================================

border:
  start: 650
  mid1: 1250
  mid2: 2500
  daily: 100
  max: 15000

bloodmoon:
  # каждая N-я ночь (день % N == 0) — Кровавая луна
  interval: 10
  # Усиление мобов ночью (amplifier: 0 = Сила I / Скорость I,
  # 1 = II, -1 = не выдавать совсем).
  mob-strength: 0
  mob-speed: 0

# Стартовые Спешка I + Скорость I выдаются до этого дня включительно.
starter-buffs-until-day: 4

