# ============================================================
#  xmusya-hard — конфигурация
#  Читается при старте сервера и по команде /xmh reload.
#
#  Порядок фаз фиксирован (сверху вниз):
#    wood -> stone -> iron -> diamond -> nether ->
#    golden_food -> villagers -> beacons -> netherite -> endgame
#
#  У каждой фазы есть:
#    day                    — день, с которого она начинается
#    border                 — размер барьера при переходе на фазу через /xmh phase
#    name / short-name      — названия в чате и боссбаре
#    limited-crafting       — геймрул limited_crafting в этой фазе
#    natural-regeneration   — геймрул natural_health_regeneration в этой фазе
#    trade                  — разрешена ли торговля с жителями
#    dimensions             — разрешённые измерения: overworld / nether / end
#    forbidden-armor        — броня, которую НЕЛЬЗЯ носить (выбрасывается)
#                             ключи: iron, golden, diamond, netherite, elytra
#                             или точный id предмета: minecraft:turtle_helmet
#    forbidden-tools        — инструменты/оружие, за которые даётся
#                             mining_fatigue + weakness
#                             ключи: stone, iron, golden, diamond, netherite
#                             или точный id: minecraft:trident
#    forbidden-items        — предметы, которые выбрасываются из инвентаря
#    recipes                — рецепты, ОТКРЫВАЮЩИЕСЯ на этой фазе
#                             (дальше они остаются открытыми навсегда)
# ============================================================

# Достижения (ванильные тосты + вкладка «Достижения»).
# Плагин сам кладёт датапак в world/datapacks и включает его.
achievements:
  enabled: true

# Префикс всех сообщений плагина в чате.
# Поддерживаются коды &a-f, &l, &r и MiniMessage-теги (<red>…</red>).
prefix: "&c[XMH] "

border:
  start: 650
  mid1: 1250
  mid2: 2500
  daily: 100
  max: 100000

bloodmoon:
  # Первая Кровавая луна — на этом дне, дальше каждую N-ю ночь.
  start-day: 30
  # Промежуток между Кровавыми лунами (дни).
  interval: 10
  # Усиление мобов ночью (amplifier: 0 = Сила I / Скорость I,
  # 1 = II, -1 = не выдавать совсем).
  mob-strength: 0
  mob-speed: 0
  # Если игрок УЖЕ был ниже mine-y (шахта) или выше height-y (высотник)
  # в момент начала Кровавой луны — она на него не действует, пока он
  # остаётся в этом диапазоне. Вернулся в обычные высоты — исключение
  # снимается до конца ночи.
  mine-y: 40
  height-y: 120
  # С какого дня в Кровавую луну появляются визер-скелеты, утопленники
  # и вексы.
  endgame-mobs-day: 60
  # Плотность мобов. Волна спавна идёт каждые 100 тиков (5 сек) на игрока.
  spawn-per-wave: 3          # мобов за волну (больше = «растрел»)
  max-hostiles-nearby: 28    # предел враждебных в 16 блоках от игрока
  spawn-attempts: 16         # попыток найти место за одно появление
  spawn-radius: 24           # радиус поиска точки спавна (блоки)
  burst-on-start: 10         # залп мобов сразу при старте КЛ
  burst-min-distance: 16     # залп спавнится не вплотную, а в кольце 16..32
  burst-max-distance: 32
  # Анти-кемп: в шахте (ниже mine-y) спавнятся вексы, на высоте (выше height-y)
  # — фантомы. false = исключённые игроки (bmExempt) анти-кемпом не трогаются,
  # true = анти-кемп работает и по ним.
  exempt-blocks-anti-camp: false

# Рейды на деревни.
raids:
  # Добавлять в рейды иллюзионеров (ванильный «Illusioner», в Java сам не спавнится).
  illusioner: true
  # С какой волны рейда появляется первый иллюзионер (гарантированно).
  illusioner-from-wave: 2
  # Шанс дополнительного иллюзионера на следующих волнах.
  illusioner-chance: 0.35
  # Максимум иллюзионеров на один рейд.
  illusioner-max: 2

# Стартовые Спешка I + Скорость I выдаются до этого дня включительно.
starter-buffs-until-day: 4

