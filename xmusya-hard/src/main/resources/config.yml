# ============================================================
#  ЭНД-МЕХАНИКИ (1.1.0)
#  Если секции end: нет — используются значения по умолчанию
#  из кода (всё равно всё работает).
# ============================================================
end:
  enabled: true

  stronghold:
    # На время ПЕРВОГО поиска крепости барьер расширяется до этого размера.
    search-border-size: 50000
    # Механика «одна рабочая крепость + ломаные порталы в остальных».
    # true = одна рабочая крепость (не ближе min-radius), у остальных портал ломается.
    enabled: true
    # Крепость выбирается от спавна: не ближе min-radius и не дальше max-radius.
    # Око и /locate structure stronghold ведут ТОЛЬКО к ней.
    # 0 = без минимального радиуса (берём ближайшую крепость)
    min-radius: 0
    max-radius: 8000
    # У всех ОСТАЛЬНЫХ крепостей портал ломается (выбивается одна рамка),
    # как только их чанки подгружаются.
    disable-other-portals: true
    # Поиск комнаты портала вокруг выбранной крепости.
    scan-radius-chunks: 8
    scan-y-min: -64
    scan-y-max: 128
    scan-chunks-per-tick: 8
  eyes:
    # Шанс, что око разобьётся (0..1). При поломке: визуальная молния,
    # лёгкий урон рядом и Свечение на игрока.
    break-chance: 0.20
    flight-ticks: 30
    lightning-damage: 4.0
    lightning-radius: 4.0
    glow-seconds: 10
    cooldown-ms: 400
    # Звук при поломке ока (пустая строка = без звука).
    break-sound: "entity.lightning_bolt.thunder"
    break-sound-volume: 1.0
    break-sound-pitch: 1.0

  pearls:
    # Жемчуг Энда падает ТОЛЬКО с эндерменов.
    # 0.10 = 10% без чар, 0.20 = 20% с Looting III (I/II — между ними).
    enderman-chance: 0.10
    enderman-chance-looting: 0.20
    remove-from-barter: true

  blaze:
    # Нельзя ставить блоки ближе этого радиуса к спавнеру блейзов.
    no-build-radius: 12
    # Взрывы гастов не ломают блоки крепости (незер-кирпич) и спавнеры.
    protect-explosions: true
    # Гасты рядом со спавнером: шанс за проверку (раз в 5 сек) и макс. число.
    ghast-chance: 0.15
    ghast-max: 2
    ghast-radius: 24

  portal:
    frames: 12
    # Награда за рамку — случайный бафф на N часов РЕАЛЬНОГО времени.
    # Одинаковые баффы складываются (две Спешки = Спешка II).
    buff-hours: 24
    # За каждые N закрытых игроком рамок — навсегда +1 сердце (2.0 HP).
    hearts-per-frames: 2
    display-interval-ticks: 2
    display-view-range: 24
    # Пул предметов для рамок. Если позиций больше, чем рамок —
    # случайно выбираются нужные. max-per-portal — лимит на портал.
    items:
      - { material: minecraft:iron_ingot,     name: "Железо",            amount: 16, max-per-portal: 3 }
      - { material: minecraft:gold_ingot,     name: "Золото",            amount: 12, max-per-portal: 2 }
      - { material: minecraft:diamond,        name: "Алмазы",            amount: 4,  max-per-portal: 2 }
      - { material: minecraft:emerald,        name: "Изумруды",          amount: 8,  max-per-portal: 2 }
      - { material: minecraft:ender_pearl,    name: "Жемчуг Энда",       amount: 4,  max-per-portal: 2 }
      - { material: minecraft:blaze_rod,      name: "Огненный стержень", amount: 6,  max-per-portal: 2 }
      - { material: minecraft:obsidian,       name: "Обсидиан",          amount: 16, max-per-portal: 2 }
      - { material: minecraft:crying_obsidian, name: "Плачущий обсидиан", amount: 6, max-per-portal: 2 }
      - { material: minecraft:ancient_debris, name: "Древние обломки",   amount: 2,  max-per-portal: 1 }
      - { material: minecraft:netherite_ingot, name: "Незеритовый слиток", amount: 1, max-per-portal: 1 }
      - { material: minecraft:nether_star,    name: "Звезда Незера",     amount: 1,  max-per-portal: 1 }
      - { material: minecraft:gold_block,     name: "Блок золота",       amount: 2,  max-per-portal: 1 }

  # Автоматические ивенты слома рамок портала.
  break:
    # Обычный слом: раз в 80 дней, начиная со 100-го дня,
    # с шансом 40% ломает 4 случайные рамки.
    normal:
      enabled: true
      start-day: 100
      interval-days: 80
      chance: 0.40
      frames: 4
    # Ультра-слом: раз в 150 дней, начиная со 100-го дня,
    # с шансом 40% ломает 1 рамку. Для починки нужен ультра-набор.
    ultra:
      enabled: true
      start-day: 100
      interval-days: 150
      chance: 0.40
      frames: 1

  # Сложная ручная починка сломанных рамок.
  # Сломанная рамка превращается в заглушку (плачущий обсидиан):
  # ПКМ по ней с нужными предметами в инвентаре — восстановить.
  # После починки рамку ещё нужно активировать оком и предметом из portal.items.
  repair:
    normal:
      items:
        - { material: minecraft:iron_block,      name: "Блок железа",       amount: 8 }
        - { material: minecraft:gold_block,      name: "Блок золота",       amount: 2 }
        - { material: minecraft:diamond,         name: "Алмазы",            amount: 4 }
        - { material: minecraft:emerald,         name: "Изумруды",          amount: 2 }
        - { material: minecraft:netherite_ingot, name: "Незеритовый слиток", amount: 1 }
    ultra:
      # Базовый набор ультра-починки (плюс одна голова из heads).
      items:
        - { material: minecraft:netherite_block,       name: "Блок незерита",             amount: 1 }
        - { material: minecraft:heavy_core,            name: "Тяжёлое ядро",              amount: 1 }
        - { material: minecraft:nether_star,           name: "Звезда Незера",             amount: 1 }
        - { material: minecraft:enchanted_golden_apple, name: "Зачарованное золотое яблоко", amount: 2 }
        - { material: minecraft:totem_of_undying,      name: "Тотем бессмертия",          amount: 1 }
        - { material: minecraft:conduit,               name: "Кондуит",                   amount: 1 }
        - { material: minecraft:trident,               name: "Трезубец",                  amount: 1 }
        - { material: minecraft:sponge,                name: "Губка",                     amount: 1 }
        - { material: minecraft:sniffer_egg,           name: "Яйцо нюхача",               amount: 1 }
        - { material: minecraft:ominous_trial_key,     name: "Зловещий ключ",             amount: 1 }
        - { material: minecraft:chorus_flower,         name: "Цветок хоруса",             amount: 1 }
        - { material: minecraft:heart_of_the_sea,      name: "Сердце моря",               amount: 1 }
      # Одна случайная голова. weight — относительный шанс;
      # голова пиглина — самый сложный (редкий) вариант.
      heads:
        - { material: minecraft:zombie_head,  name: "Голова зомби",   weight: 55 }
        - { material: minecraft:creeper_head, name: "Голова крипера", weight: 30 }
        - { material: minecraft:piglin_head,  name: "Голова пиглина", weight: 15 }
    # Награда починщику: сильные эффекты на несколько РЕАЛЬНЫХ дней.
    buff:
      real-days: 3
      effects:
        - { effect: resistance,   amplifier: 1 }
        - { effect: regeneration, amplifier: 1 }
        - { effect: strength,     amplifier: 1 }

  cycle:
    # С этого дня каждые interval-days портал гаснет и 1..N рамок
    # сбрасываются с новыми предметами.
    start-day: 100
    interval-days: 50
    reset-min: 1
    reset-max: 4

  protection:
    # За попытку сломать портал/рамку/спавнер комнаты: регенерация,
    # визуальный взрыв, проклятие и запрет входа в Энд.
    curse-hours: 6
    end-ban-hours: 6
    # Эффекты при попытке сломать рамку/портал/спавнер
    # (лечение, проклятие, молния, взрыв). По умолчанию ВЫКЛЮЧЕНО:
    # блок просто не ломается. true = включить старые эффекты.
    break-effects: false

  outer-islands:
    # Внешние острова Энда закрыты до этого дня (шлюзы + отталкивание).
    unlock-day: 80
    max-distance: 450

  dragon:
    # Прочность щита при блоке атаки дракона тратится не чаще этого времени.
    shield-cooldown-ms: 1800

  void:
    # Падение ниже Y=0 в Энде при наличии жемчуга: левитация и бонус.
    min-y: 0
    pearls: 2
    levitation-seconds: 10
    # Уровень = значение + 1. 14 = Левитация XV (высокая, чтобы долетал)
    levitation-amplifier: 14
    # Сердца при спасении из пустоты: -1 = отнимает 1 сердце,
    # 0 = не трогать, положительное = даёт сердца
    hearts: -1
    # Снимать обычную левитацию (уровни 1..N) у игрока в пустоте Энда
    # ниже strip-levitation-max-y — чтобы нельзя было «залететь» обратно.
    # Уровень = значение + 1 (0 = Левитация I, 2 = Левитация III).
    # Левитация от самого плагина (спасение из пустоты) не снимается.
    strip-levitation: true
    strip-levitation-max-level: 3
    strip-levitation-max-y: 15
    # Снимать ачивку «Great View From Up Here» (minecraft:end/levitate),
    # которую выдаёт левитация, и возвращать её опыт
    cancel-levitation-advancement: true
    levitation-advancement-xp: 50
    slow-falling-seconds: 15
    slow-falling-amplifier: 0    # 0 = Плавное падение I

  egg:
    # Устарело: /xmh egg удалён, яйцо дракона теперь — Драконий маяк.
    # Ключи оставлены для совместимости старых конфигов.
    haste-amplifier: 1
    speed-amplifier: 0
