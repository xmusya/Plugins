# Конфигурация стартовой книги-гайда (Material.WRITTEN_BOOK) для xmusya-hard 1.1.15
# Текст и оформление берутся из guide.yml.
# Длинные строки плагин переносит сам по пикселям ванильного шрифта,
# а не влезающие страницы разбивает по 14 строк (ничего не обрезается).
# Пишите каждый пункт одной строкой — переносы расставит плагин.

book:
  enabled: true
  title: "&c[XMH] &6Гайд хардкора 1.1.15"
  author: "&7xmusya-hard &8(1.1.15)"
  give-once-key: "xmh_guide_book_given"
  # true = книга выдаётся автоматически при входе на сервер (по умолчанию ВЫКЛ).
  # Выдать книгу вручную: /xmh guide [ник].
  give-on-join: false
  drop-if-inventory-full: true
  # Ширина строки в пикселях и число строк на странице.
  # Ванильная книга 26.3: TEXT_WIDTH = 114 px, TEXT_HEIGHT = 128 px, строка 9 px
  # => 14 строк. 112 px — небольшой запас, чтобы клиент не переносил сам.
  page-width-px: 112
  page-lines: 14
  # Запасной режим (если page-width-px: 0) — ширина в символах.
  page-width: 19

