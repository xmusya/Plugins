# ╔══════════════════════════════════════════════════════════════════════╗
# ║  xmusya-worlds  —  мультимировой хаб с порталами, общим Эндом и        ║
# ║  памятью позиций игрока по мирам.  Paper/Leaf 26.3.                     ║
# ║  Этот файл ОЧЕНЬ гибкий: почти всё настраивается тут. После правок —   ║
# ║  /worlds reload (или /reload).  Новые ключи доливаются автоматически.  ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ─────────────────────────────────────────────────────────────────────────
# ОБЩЕЕ
# ─────────────────────────────────────────────────────────────────────────
general:
  # Мир, куда игрок попадает по умолчанию (новички + после логина у AuthMe).
  # Должен быть в списке worlds ниже.
  default-world: hub

  # Команда возврата в хаб (/hub). Это просто алиас — см. hub-command.
  # Текст при телепорте в хаб (MiniMessage/legacy &). Пусто = без сообщения.
  hub-teleport-message: "&eТы вернулся в хаб."

  # Сколько тиков (1 сек = 20) хранить «слепоту» после входа в портал.
  # 0 = выключить эффект.
  portal-blindness-ticks: 20
  # Уровень слепоты (0 = I).
  portal-blindness-amplifier: 0

  # Задержка в тиках перед телепортом после входа в область портала (0.2с = 4).
  portal-delay-ticks: 4

  # Кулдаун на повторный вход в ТОТ ЖЕ портал, в тиках (чтобы не телепортило
  # туда-обратно, если порталы рядом). 40 = 2 сек.
  portal-cooldown-ticks: 40

  # Сканировать позиции игроков каждые N тиков (проверка «внутри ли портала»).
  # Меньше = отзывчивее, больше = меньше нагрузка. 5 тиков = 4 раза/сек.
  scan-interval-ticks: 5

  # Запоминать последнюю позицию игрока в каждом мире (players.yml).
  # При входе в мир игрок появляется там, где вышел в прошлый раз.
  remember-positions: true

  # Возвращать игрока в исходный мир при выходе из общего Энда.
  # См. end-sync.
  end-sync: true

  # ── ОПТИМИЗАЦИЯ (важно для слабого сервера/телефона) ──
  # Держать ли СПАВН-ЧАНКИ не-хаб миров постоянно в памяти.
  #   false (по умолчанию) — Paper выгружает спавн-чанки миров, куда никто не
  #     заходит (cave/farm/islands/Энд). Сильно экономит RAM (5 миров = 5
  #     наборов спавн-чанков, иначе ~сотни чанков в памяти впустую).
  #   true — держать как в ванили (нужно, только если мир должен быть всегда
  #     прогружен, напр. для редстоун-конструкций без игроков).
  # Хаб (build-portals) держит спавн ВСЕГДА, независимо от этой опции.
  keep-spawn-loaded-others: false

# ─────────────────────────────────────────────────────────────────────────
# МИРЫ
# ─────────────────────────────────────────────────────────────────────────
# Каждый мир создаётся плагином при старте, если его папки ещё нет.
#   name        — имя папки мира (world_<...>), уникальное.
#   generator   — как генерировать:
#                   vanilla   — ванильная генерация (по умолчанию)
#                   void      — пустой мир (только блок-воздух/пустота)
#                   flat      — плоский мир (superflat)
#                   datapack:<файл в datapacks/> — мир с датапаком
#   environment — NORMAL / NETHER / THE_END
#   world-type  — NORMAL / FLAT / AMPLIFIED / LARGE_BIOMES (для vanilla/flat)
#   seed        — сид (0 = случайный)
#   spawn       — точка спавна мира {x,y,z,yaw,pitch}. Если не задана —
#                 берётся дефолтная (для void/flat — 0,64,0).
#   build-portals — строить ли порталы В ЭТОМ мире (обычно только хаб).
#                   Регионы задаются в секции portals ниже.
worlds:
  # ХАБ — сюда ведут все порталы. Уже построен (мир xmhub).
  hub:
    name: xmhub
    generator: vanilla
    environment: NORMAL
    world-type: FLAT
    seed: 0
    build-portals: true
    spawn: {x: 0, y: 42, z: 0, yaw: -90, pitch: 0}

  # ВЫЖИВАНИЕ — основной мир (уже существует как level-name).
  survival:
    name: world
    generator: vanilla
    environment: NORMAL
    world-type: NORMAL
    seed: 0
    build-portals: false

  # ПЕЩЕРЫ — датапак Cave World.
  cave:
    name: world_cave
    generator: datapack:cave-world.zip
    environment: NORMAL
    world-type: NORMAL
    seed: random
    build-portals: false

  # ФЕРМЫ — ванильная генерация.
  farm:
    name: world_farm
    generator: vanilla
    environment: NORMAL
    world-type: NORMAL
    seed: random
    build-portals: false

  # ОСТРОВА — датапак Revamped Floating Islands.
  islands:
    name: world_islands
    generator: datapack:floating-islands.zip
    environment: NORMAL
    world-type: NORMAL
    seed: random
    build-portals: false

# ─────────────────────────────────────────────────────────────────────────
# СИНХРОНИЗАЦИЯ ДАТАПАКОВ
# ─────────────────────────────────────────────────────────────────────────
# Копирует датапаки (.zip) из мира-источника во ВСЕ остальные миры — чтобы
# твои паки (напр. «быстрые счастливые гасты») работали одинаково везде.
# Копирование идёт при старте (до загрузки миров), поэтому паки применяются и
# к уже существующим мирам. cave/islands сохраняют и свои встроенные паки.
#   source  — мир-источник (папка). Пусто "" = основной мир (level-name, обычно world).
#   include — копировать ТОЛЬКО эти имена .zip. Пусто [] = все.
#   exclude — НЕ копировать эти имена.
datapacks:
  sync:
    enabled: true
    source: ""
    include: []
    exclude: []

# ─────────────────────────────────────────────────────────────────────────
# ПОРТАЛЫ (области в мирах, при входе в которые телепортирует)
# ─────────────────────────────────────────────────────────────────────────
# Работают ТОЛЬКО в мирах, где build-portals: true (обычно хаб).
# Регион задаётся двумя углами (min/max) — ВНУТРЕННЯЯ часть портала.
# Координаты: x,y,z. Порядок min/max не важен (нормализуется).
#   to       — ключ мира из секции worlds (куда телепорт).
#   label    — название для сообщений (любое).
#   message  — сообщение при телепорте (MiniMessage/legacy &). Пусто = нет.
#   target   — где игрок появляется в целевом мире:
#                memory (по умолч.) — его запомненная позиция, иначе спавн мира
#                spawn              — всегда спавн мира
#                coords           — фикс. точка {x,y,z,yaw,pitch}
#   cooldown — переопределить общий portal-cooldown-ticks для этого портала.
portals:
  to_cave:
    to: cave
    label: "Мир пещер"
    min: {x: -3, y: 44, z: 7}
    max: {x: -1, y: 46, z: 7}
    target: memory
    message: "&8→ Мир пещер"
  to_farm:
    to: farm
    label: "Мир ферм"
    min: {x: -10, y: 44, z: -2}
    max: {x: -10, y: 46, z: 0}
    target: memory
    message: "&8→ Мир ферм"
  to_islands:
    to: islands
    label: "Мир островов"
    min: {x: -3, y: 44, z: -12}
    max: {x: -1, y: 46, z: -10}
    target: memory
    message: "&8→ Мир островов"
  to_survival:
    to: survival
    label: "Мир выживания"
    min: {x: 6, y: 44, z: -2}
    max: {x: 6, y: 46, z: 0}
    target: memory
    message: "&8→ Мир выживания"

# ─────────────────────────────────────────────────────────────────────────
# ОБЩИЙ ЭНД (end-sync)
# ─────────────────────────────────────────────────────────────────────────
# Если general.end-sync: true — вход в Энд из ЛЮБОГО мира ведёт в один общий
# Энд-мир (end.shared-world, по умолчанию world_the_end). При выходе из него
# игрок возвращается в тот мир, откуда пришёл, на его позицию.
# Если false — у каждого мира свой обычный Энд (ванильное поведение).
end:
  # Имя общего Энд-мира (создаётся плагином, environment THE_END).
  shared-world: world_the_end
  # Сообщение при входе в общий Энд. Пусто = нет.
  enter-message: "&5Общий Энд"
  # Сообщение при выходе из Энда (возврат). Пусто = нет.
  exit-message: "&5Возврат из Энда"
  # Куда игрок попадает в общем Энде. Если не задан — ванильная платформа
  # 100,49,0 (обсидиан 5×5 под Y=48, вокруг пустота — это ванильный Энд).
  # spawn: {x: 100, y: 49, z: 0, yaw: 0, pitch: 0}

# ─────────────────────────────────────────────────────────────────────────
# КОМАНДА ВОЗВРАТА В ХАБ
# ─────────────────────────────────────────────────────────────────────────
hub-command:
  # Включить команду /hub.
  enabled: true
  # Имя команды (без слэша).
  name: hub

# ─────────────────────────────────────────────────────────────────────────
# ХАБ: РЕЖИМ ПРИКЛЮЧЕНИЯ
# ─────────────────────────────────────────────────────────────────────────
hub:
  # В хабе — режим приключений, в остальных мирах — выживание.
  adventure-mode: true

# ─────────────────────────────────────────────────────────────────────────
# РЕСПАВН
# ─────────────────────────────────────────────────────────────────────────
respawn:
  # Респавн в мире, где игрок умер (а не в выживании).
  in-death-world: true

# ─────────────────────────────────────────────────────────────────────────
# ПУСТОТА
# ─────────────────────────────────────────────────────────────────────────
void:
  levitation:
    # Левитация при падении в пустоту.
    enabled: true
    amplifier: 4         # V (0 = I)
    duration-ticks: 200  # 10 секунд
    min-y: -64           # ниже этого Y — пустота
  # Телепорт на спавн мира вместо левитации.
  teleport-to-spawn: true
  # Эффект пустоты ТОЛЬКО в хабе (иначе ловит пещеры/нижние Y в других мирах).
  only-hub: true